<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Testfälle</title></head>
<body>
<h1>Testfälle</h1>

<form th:action="@{/testcases}" th:object="${testcase}" method="post">
    <input th:field="*{title}" placeholder="Titel" required/>
    <input th:field="*{description}" placeholder="Beschreibung"/>
    <select name="requirementId">
        <option value="">-- Anforderung wählen --</option>
        <option th:each="r : ${requirements}"
                th:value="${r.id}"
                th:text="${r.title}"></option>
    </select>
    <button type="submit">Speichern</button>
</form>

<table border="1">
    <tr><th>ID</th><th>Titel</th><th>Anforderung</th></tr>
    <tr th:each="t : ${testcases}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.title}"></td>
        <td th:text="${t.requirement != null ? t.requirement.title : '-'}"></td>
    </tr>
</table>
</body>
</html>
