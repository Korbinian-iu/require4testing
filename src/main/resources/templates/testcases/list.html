<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Testfälle')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('testcases')}"></nav>

<main class="container">
    <h1>Testfälle</h1>
    <p class="subtitle">US3 – Testfälle zu einer Anforderung erstellen.</p>

    <div class="card">
        <h2>Neuer Testfall</h2>
        <form class="inline" th:action="@{/testcases}" th:object="${testcase}" method="post">
            <input type="text" th:field="*{title}" placeholder="Titel" required/>
            <input type="text" th:field="*{description}" placeholder="Beschreibung"/>
            <select name="requirementId" required>
                <option value="" disabled selected>-- Anforderung wählen --</option>
                <option th:each="r : ${requirements}"
                        th:value="${r.id}"
                        th:text="${r.title}"></option>
            </select>
            <button type="submit">Speichern</button>
        </form>
    </div>

    <table>
        <tr><th>ID</th><th>Titel</th><th>Anforderung</th></tr>
        <tr th:each="t : ${testcases}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.title}"></td>
            <td th:text="${t.requirement != null ? t.requirement.title : '-'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(testcases)}">
            <td colspan="3" class="empty">Noch keine Testfälle erfasst.</td>
        </tr>
    </table>
</main>
</body>
</html>
