<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Testdurchführungen')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('executions')}"></nav>

<main class="container">
    <h1>Testdurchführungen</h1>
    <p class="subtitle">US4 – Zuordnen · US5 – Ergebnis pro Schritt erfassen.</p>

    <div class="card">
        <h2>Testfall zuordnen (US4)</h2>
        <form class="inline" th:action="@{/executions}" method="post">
            <select name="testRunId" required>
                <option value="" disabled selected>-- Testlauf wählen --</option>
                <option th:each="r : ${testruns}" th:value="${r.id}" th:text="${r.name}"></option>
            </select>
            <select name="testCaseId" required>
                <option value="" disabled selected>-- Testfall wählen --</option>
                <option th:each="t : ${testcases}" th:value="${t.id}" th:text="${t.title}"></option>
            </select>
            <select name="testerId" required>
                <option value="" disabled selected>-- Tester:in wählen --</option>
                <option th:each="u : ${testers}" th:value="${u.id}" th:text="${u.username}"></option>
            </select>
            <button type="submit">Zuordnen</button>
        </form>
    </div>

    <table>
        <tr><th>ID</th><th>Testlauf</th><th>Testfall</th><th>Tester:in</th><th>Gesamtergebnis</th><th></th></tr>
        <tr th:each="e : ${executions}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.testRun != null ? e.testRun.name : '-'}"></td>
            <td th:text="${e.testCase != null ? e.testCase.title : '-'}"></td>
            <td th:text="${e.tester != null ? e.tester.username : '-'}"></td>
            <td th:text="${statusByExecution[e.id]}"></td>
            <td><a th:href="@{/executions/{id}(id=${e.id})}">Ergebnisse erfassen</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(executions)}">
            <td colspan="6" class="empty">Noch keine Zuordnungen vorhanden.</td>
        </tr>
    </table>
</main>
</body>
</html>
