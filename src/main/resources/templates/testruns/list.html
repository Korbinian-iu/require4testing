<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Testläufe</title></head>
<body>
<h1>Testläufe</h1>

<form th:action="@{/testruns}" th:object="${testrun}" method="post">
    <input th:field="*{name}" placeholder="Name des Testlaufs" required/>
    <button type="submit">Speichern</button>
</form>

<table border="1">
    <tr><th>ID</th><th>Name</th><th>Erstellt am</th></tr>
    <tr th:each="t : ${testruns}">
        <td th:text="${t.id}"></td>
        <td th:text="${t.name}"></td>
        <td th:text="${t.createdAt}"></td>
    </tr>
</table>
</body>
</html>
