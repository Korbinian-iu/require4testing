<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Testläufe')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('testruns')}"></nav>

<main class="container">
    <h1>Testläufe</h1>
    <p class="subtitle">US2 – Testläufe anlegen.</p>

    <div class="card">
        <h2>Neuer Testlauf</h2>
        <form class="inline" th:action="@{/testruns}" th:object="${testrun}" method="post">
            <input type="text" th:field="*{name}" placeholder="Name des Testlaufs" required/>
            <button type="submit">Speichern</button>
        </form>
    </div>

    <table>
        <tr><th>ID</th><th>Name</th><th>Erstellt am</th></tr>
        <tr th:each="t : ${testruns}">
            <td th:text="${t.id}"></td>
            <td th:text="${t.name}"></td>
            <td th:text="${#temporals.format(t.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(testruns)}">
            <td colspan="3" class="empty">Noch keine Testläufe angelegt.</td>
        </tr>
    </table>
</main>
</body>
</html>
